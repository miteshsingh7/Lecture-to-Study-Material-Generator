<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="web_standard" name="shell-type" />
    <title>Lecture // Study — Technical Study Instrument</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      .markdown-content h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.75rem;
        font-weight: 600;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        color: #1c1c19;
        border-bottom: 1px solid #dfc0b5;
        padding-bottom: 0.5rem;
      }
      .markdown-content h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.35rem;
        font-weight: 600;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        color: #a13a00;
      }
      .markdown-content h3 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        color: #1c1c19;
      }
      .markdown-content p {
        margin-bottom: 0.85rem;
        line-height: 1.6;
        color: #1c1c19;
      }
      .markdown-content ul {
        list-style-type: disc;
        margin-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .markdown-content ol {
        list-style-type: decimal;
        margin-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .markdown-content li {
        margin-bottom: 0.35rem;
        line-height: 1.55;
      }
      .markdown-content strong {
        color: #1c1c19;
        font-weight: 600;
      }
      .markdown-content blockquote {
        border-left: 3px solid #a13a00;
        padding-left: 1rem;
        margin-left: 0;
        color: #57423a;
        background: #f0ede9;
        padding: 0.75rem 1rem;
        border-radius: 0 0.5rem 0.5rem 0;
      }
      .markdown-content code {
        font-family: "Geist", monospace;
        background: #ebe0db;
        padding: 0.15rem 0.35rem;
        border-radius: 0.25rem;
        font-size: 0.9em;
      }
    </style>
